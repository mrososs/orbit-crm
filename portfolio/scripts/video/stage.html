<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Orbit CRM — recording stage</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url('/__media/inter.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        src: url('/__media/plex-arabic-600.woff2') format('woff2');
        font-weight: 600;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        font-family: 'Inter Variable', 'IBM Plex Sans Arabic', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #0b0d14;
        color: #fff;
      }
      .ar { font-family: 'IBM Plex Sans Arabic', 'Inter Variable', sans-serif; }

      /* ── App viewport ─────────────────────────────── */
      #wrap {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        transform-origin: center center;
        transition: width 900ms cubic-bezier(0.65, 0, 0.35, 1), height 900ms cubic-bezier(0.65, 0, 0.35, 1),
          left 900ms cubic-bezier(0.65, 0, 0.35, 1), top 900ms cubic-bezier(0.65, 0, 0.35, 1),
          border-radius 900ms ease, box-shadow 900ms ease, transform 900ms cubic-bezier(0.65, 0, 0.35, 1);
        overflow: hidden; background: #f6f7f9;
      }
      #wrap iframe { width: 100%; height: 100%; border: 0; display: block; background: #f6f7f9; }
      body.phone #wrap {
        border-radius: 44px;
        box-shadow: 0 0 0 10px #15171f, 0 0 0 11px rgba(255, 255, 255, 0.14), 0 50px 120px -20px rgba(0, 0, 0, 0.8);
      }
      #backdrop {
        position: absolute; inset: 0; opacity: 0; transition: opacity 700ms ease;
        background:
          radial-gradient(900px 600px at 70% 20%, rgba(91, 84, 232, 0.4), transparent 70%),
          radial-gradient(700px 500px at 15% 90%, rgba(27, 175, 122, 0.14), transparent 70%), #0b0d14;
      }
      body.phone #backdrop, body.vertical #backdrop { opacity: 1; }

      /* ── Caption ──────────────────────────────────── */
      #caption {
        position: absolute; left: 40px; bottom: 40px; max-width: 720px;
        padding: 20px 26px 22px 26px; border-radius: 18px;
        background: rgba(13, 15, 23, 0.86); backdrop-filter: blur(10px);
        box-shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        opacity: 0; transform: translateY(16px); transition: opacity 450ms ease, transform 450ms cubic-bezier(0.2, 0.8, 0.2, 1);
        pointer-events: none;
      }
      #caption.show { opacity: 1; transform: translateY(0); }
      #caption .eyebrow { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a9a7fb; }
      #caption .eyebrow::before { content: ''; width: 22px; height: 3px; border-radius: 3px; background: #7b78f6; }
      #caption .title { margin-top: 8px; font-size: 32px; line-height: 1.15; font-weight: 650; letter-spacing: -0.02em; }
      #caption .sub { margin-top: 8px; font-size: 17px; color: #c3c7d1; }
      body.phone #caption { left: auto; right: 70px; bottom: 50%; transform: translateY(50%); max-width: 470px; }
      body.phone #caption.show { transform: translateY(50%); }

      /* ── Title card ───────────────────────────────── */
      #title {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        background: radial-gradient(1000px 700px at 50% 35%, rgba(91, 84, 232, 0.45), transparent 70%), rgba(11, 13, 20, 0.9);
        backdrop-filter: blur(14px);
        opacity: 0; transition: opacity 800ms ease; pointer-events: none;
      }
      #title.show { opacity: 1; }
      #title .logo { width: 84px; height: 84px; transform: scale(0.9); transition: transform 900ms cubic-bezier(0.2, 0.8, 0.2, 1); }
      #title.show .logo { transform: scale(1); }
      #title h1 { margin-top: 28px; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.04em; }
      #title h1 span { color: #a9a7fb; }
      #title p { margin-top: 20px; font-size: 24px; color: #c3c7d1; }
      #title .chips { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      #title .chips span { padding: 9px 16px; border-radius: 999px; font-size: 17px; font-weight: 550; color: #e9ebf0; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12); }

      /* ── Cursor, ripple, highlight ────────────────── */
      #cursor {
        position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 50; pointer-events: none;
        transform: translate(-100px, -100px); transition-property: transform; transition-timing-function: cubic-bezier(0.45, 0, 0.2, 1);
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
      }
      body.touch #cursor svg { display: none; }
      body.touch #cursor::after {
        content: ''; position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.55); box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.7);
      }
      .ripple {
        position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; z-index: 49; pointer-events: none;
        border: 2px solid rgba(79, 70, 229, 0.85); animation: ripple 520ms ease-out forwards;
      }
      @keyframes ripple { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
      #highlight {
        position: absolute; z-index: 40; pointer-events: none; border-radius: 16px; opacity: 0;
        box-shadow: 0 0 0 3px rgba(91, 84, 232, 0.95), 0 0 0 9px rgba(91, 84, 232, 0.22);
        transition: opacity 350ms ease, left 450ms ease, top 450ms ease, width 450ms ease, height 450ms ease;
      }
      #highlight.show { opacity: 1; }

      /* ── Vertical (9:16) layout ───────────────────── */
      #headline { display: none; }
      body.vertical #headline {
        display: block; position: absolute; left: 0; right: 0; top: 70px; text-align: center; padding: 0 40px;
      }
      #headline .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 650; }
      #headline .brand svg { width: 30px; height: 30px; }
      #headline h2 { margin-top: 18px; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; transition: opacity 300ms ease; }
      #headline h2 span { color: #a9a7fb; }
      #headline p { margin-top: 10px; font-size: 18px; color: #c3c7d1; transition: opacity 300ms ease; }
      body.vertical #caption { display: none; }
      body.vertical #wrap {
        left: 75px; top: 290px; width: 390px; height: 630px; border-radius: 40px;
        box-shadow: 0 0 0 9px #15171f, 0 0 0 10px rgba(255, 255, 255, 0.14), 0 40px 100px -20px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="headline">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#5b54e8" /><circle cx="16" cy="16" r="5" fill="#fff" /><ellipse cx="16" cy="16" rx="11" ry="5.2" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" transform="rotate(-28 16 16)" /><circle cx="25.2" cy="11.4" r="1.9" fill="#c7d2fe" /></svg>
        Orbit CRM
      </div>
      <h2 id="headline-title"></h2>
      <p id="headline-sub"></p>
    </div>
    <div id="wrap"><iframe id="app-frame" name="app" title="Orbit CRM"></iframe></div>
    <div id="highlight"></div>
    <div id="caption"><div class="eyebrow" id="caption-eyebrow"></div><div class="title" id="caption-title"></div><div class="sub" id="caption-sub"></div></div>
    <div id="title">
      <svg class="logo" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#5b54e8" /><circle cx="16" cy="16" r="5" fill="#fff" /><ellipse cx="16" cy="16" rx="11" ry="5.2" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" transform="rotate(-28 16 16)" /><circle cx="25.2" cy="11.4" r="1.9" fill="#c7d2fe" /></svg>
      <h1 id="title-heading"></h1>
      <p id="title-sub"></p>
      <div class="chips" id="title-chips"></div>
    </div>
    <div id="cursor">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2.5 19.5 12l-6.6 1.6 4.1 7.1-2.9 1.7-4.1-7.1L5 20z" fill="#10141f" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" /></svg>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      window.stage = {
        load(url) {
          return new Promise((resolve) => {
            $('app-frame').onload = () => resolve();
            $('app-frame').src = url;
          });
        },
        mode(name) {
          document.body.classList.toggle('vertical', name === 'vertical');
          document.body.classList.toggle('touch', name === 'vertical');
        },
        caption(eyebrow, title, sub = '') {
          $('caption-eyebrow').textContent = eyebrow;
          $('caption-title').innerHTML = title;
          $('caption-sub').innerHTML = sub;
          $('caption').classList.add('show');
        },
        hideCaption() { $('caption').classList.remove('show'); },
        headline(title, sub = '') {
          for (const id of ['headline-title', 'headline-sub']) $(id).style.opacity = '0';
          setTimeout(() => {
            $('headline-title').innerHTML = title;
            $('headline-sub').innerHTML = sub;
            for (const id of ['headline-title', 'headline-sub']) $(id).style.opacity = '1';
          }, 300);
        },
        title(heading, sub = '', chips = []) {
          $('title-heading').innerHTML = heading;
          $('title-sub').innerHTML = sub;
          $('title-chips').innerHTML = chips.map((c) => `<span${/[؀-ۿ]/.test(c) ? ' class="ar"' : ''}>${c}</span>`).join('');
          $('title').classList.add('show');
        },
        hideTitle() { $('title').classList.remove('show'); },
        phone(on, { width = 390, height = 844, scale = 0.86 } = {}) {
          const wrap = $('wrap');
          document.body.classList.toggle('phone', on);
          if (on) {
            wrap.style.width = `${width}px`;
            wrap.style.height = `${height}px`;
            wrap.style.left = `${innerWidth * 0.3 - width / 2}px`;
            wrap.style.top = `${(innerHeight - height) / 2}px`;
            wrap.style.transform = `scale(${scale})`;
          } else {
            wrap.removeAttribute('style');
          }
        },
        cursor(x, y, ms = 600) {
          const c = $('cursor');
          c.style.transitionDuration = `${ms}ms`;
          c.style.transform = `translate(${x}px, ${y}px)`;
        },
        ripple(x, y) {
          const r = document.createElement('div');
          r.className = 'ripple';
          r.style.left = `${x}px`;
          r.style.top = `${y}px`;
          document.body.appendChild(r);
          setTimeout(() => r.remove(), 600);
        },
        highlight(rect, pad = 6) {
          const h = $('highlight');
          if (!rect) return h.classList.remove('show');
          Object.assign(h.style, {
            left: `${rect.x - pad}px`, top: `${rect.y - pad}px`, width: `${rect.width + pad * 2}px`, height: `${rect.height + pad * 2}px`,
          });
          h.classList.add('show');
        },
      };
    </script>
  </body>
</html>
